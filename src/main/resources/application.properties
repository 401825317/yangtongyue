server.port=${PORT:8082}

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yangtongyue?characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.baby.name=${BABY_NAME:Yang Tong Yue}
app.baby.birthday=${BABY_BIRTHDAY:}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# local | cos
app.storage.type=${STORAGE_TYPE:cos}
app.storage.local.dir=${STORAGE_LOCAL_DIR:./data/files}
app.storage.cos.secret-id=${COS_SECRET_ID:}
app.storage.cos.secret-key=${COS_SECRET_KEY:}
app.storage.cos.region=${COS_REGION:ap-shanghai}
app.storage.cos.bucket=${COS_BUCKET:yangtongyue-1252240258}
app.storage.cos.public-base-url=${COS_PUBLIC_BASE_URL:}
